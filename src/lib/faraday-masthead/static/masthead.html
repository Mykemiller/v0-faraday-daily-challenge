<!-- faraday-masthead 1.0.0 · static snippet (generated by scripts/build.mjs from core.ts; do not edit).
     Include static/masthead.css once per page. Fill: {{APP_NAME}} {{HOME}} {{SKIP}} {{INITIAL}} (escaped), {{CONTEXT}} {{WHO}} (trusted HTML;
     WHO = <a class="fm-signin" href="…">Sign in</a> or <span class="fm-user" title="email">email</span>).
     The trailing <script> is the optional narrow-screen menu toggle. -->
<header class="fm" role="banner" data-fm="1.0.0"><a class="fm-skip" href="#{{SKIP}}">Skip to content</a><div class="fm-bar"><a class="fm-markl" href="{{HOME}}" tabindex="-1" aria-hidden="true"><span class="fm-mark">F</span></a><a class="fm-word" href="{{HOME}}" aria-label="Faraday home">Faraday</a><div class="fm-ctx" data-open="false"><button type="button" class="fm-avatar" aria-expanded="false" aria-controls="fm-panel" aria-label="Open menu">{{INITIAL}}</button><div class="fm-panel" id="fm-panel">{{CONTEXT}}<span class="fm-app">{{APP_NAME}}</span>{{WHO}}</div></div></div></header>
<script>(function(){var c=document.querySelector('.fm-ctx');if(!c)return;var b=c.querySelector('.fm-avatar');if(!b)return;b.addEventListener('click',function(){var o=c.getAttribute('data-open')==='true';c.setAttribute('data-open',o?'false':'true');b.setAttribute('aria-expanded',o?'false':'true');});document.addEventListener('keydown',function(e){if(e.key==='Escape'&&c.getAttribute('data-open')==='true'){c.setAttribute('data-open','false');b.setAttribute('aria-expanded','false');b.focus();}});document.addEventListener('click',function(e){if(!c.contains(e.target)){c.setAttribute('data-open','false');b.setAttribute('aria-expanded','false');}});})();</script>

<!-- faraday-masthead 1.1.0 · static snippet (generated by scripts/build.mjs from core.ts; do not edit).

<header class="fm" role="banner" data-fm="1.1.0"><a class="fm-skip" href="#{{SKIP}}">Skip to content</a><div class="fm-bar"><a class="fm-markl" href="{{HOME}}" tabindex="-1" aria-hidden="true"><span class="fm-mark">F</span></a><a class="fm-word" href="{{HOME}}" aria-label="Faraday home">Faraday</a><div class="fm-ctx" data-open="false"><button type="button" class="fm-avatar" aria-expanded="false" aria-controls="fm-panel" aria-label="Open menu">{{INITIAL}}</button><div class="fm-panel" id="fm-panel">{{CONTEXT}}<span class="fm-app">{{APP_NAME}}</span>{{WHO}}</div></div></div></header>
<script>(function(){var c=document.querySelector('.fm-ctx');if(!c)return;var b=c.querySelector('.fm-avatar');if(!b)return;var p=c.querySelector('.fm-panel');c.setAttribute('data-fm-js','');function on(){return c.getAttribute('data-open')==='true';}function set(o){c.setAttribute('data-open',o?'true':'false');b.setAttribute('aria-expanded',o?'true':'false');}b.addEventListener('click',function(){set(!on());});if(p)p.addEventListener('click',function(e){var t=e.target&&e.target.closest?e.target.closest('a,button'):null;if(t&&p.contains(t))set(false);},true);c.addEventListener('focusout',function(e){var to=e.relatedTarget;if(to&&!c.contains(to))set(false);});document.addEventListener('keydown',function(e){if(e.key==='Escape'&&on()){set(false);b.focus();}});document.addEventListener('click',function(e){if(!c.contains(e.target))set(false);});document.addEventListener('fm:close',function(){set(false);});})();</script>

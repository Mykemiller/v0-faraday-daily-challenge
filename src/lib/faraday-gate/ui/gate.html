<!doctype html>
<!-- faraday-gate · ui/gate.html (FDY-414). Static fallback gate for apps without React.
     Server fills {{APP}}, {{APP_NAME}}, {{STORY}}, {{VERSION}} (HTML-escaped). Same rules as GatePage: no prices, no counts.
     Posts to /api/faraday-gate/request on the same origin. -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{APP_NAME}} · Faraday</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600&family=IBM+Plex+Mono&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
:root{--forest:#1C3424;--forest-mid:#244228;--forest-light:#325638;--gold:#C4922A;--gold-light:#DAB050;--surface:#F8F5F0;--surface-warm:#EEE6DA;--ink:#141210;--sage:#8CA68A;--alert:#B8710A;--neutral:#B2A898}
*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif}
.rule{height:3px;background:var(--gold)}.mast{background:var(--forest);color:var(--surface);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 16px}
.mark{width:34px;height:34px;border-radius:6px;background:var(--forest-light);border:1px solid var(--gold);display:grid;place-items:center;font-family:'IBM Plex Serif',serif;color:var(--gold-light)}
.word{font-family:'IBM Plex Serif',serif;font-size:20px;font-weight:600}.ctx{justify-self:end;color:var(--sage);font-size:13px}
main{max-width:640px;margin:0 auto;padding:32px 16px 48px}h1{font-family:'IBM Plex Serif',serif;color:var(--forest);font-size:30px;margin:0 0 12px}
p{font-size:17px;line-height:1.55}.btns{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 20px}
button{min-height:44px;padding:0 20px;border-radius:6px;font:600 16px 'Bricolage Grotesque',system-ui,sans-serif;cursor:pointer;border:2px solid var(--forest);background:transparent;color:var(--forest)}
button.primary{background:var(--gold);border-color:var(--gold);color:var(--ink)}
form{background:var(--surface-warm);border-radius:8px;padding:16px;margin:0 0 20px}label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
input,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:6px;border:1px solid var(--neutral);font:16px 'Bricolage Grotesque',system-ui,sans-serif}
textarea{min-height:88px}:focus-visible{outline:3px solid var(--gold-light);outline-offset:2px}
.commercial{font-size:15px;color:var(--forest-mid);border-top:1px solid var(--neutral);padding-top:16px}
footer{border-top:3px solid var(--gold);background:var(--forest);color:var(--surface);padding:14px 16px;font-size:13px;display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
footer a{color:var(--surface)}.v{font-family:'IBM Plex Mono',monospace;color:var(--sage)}
</style>
</head>
<body>
<header><div class="rule"></div><div class="mast"><span class="mark" aria-hidden="true">F</span><span class="word">Faraday</span><span class="ctx">{{APP_NAME}}</span></div><div class="rule"></div></header>
<main>
  <h1>{{APP_NAME}}</h1>
  <p>{{STORY}}</p>
  <div class="btns">
    <button type="button" class="primary" data-kind="demo">Request demo access</button>
    <button type="button" data-kind="waitlist">Join the waitlist</button>
  </div>
  <form id="fg" hidden>
    <label for="fg-email">Email</label><input id="fg-email" type="email" required autocomplete="email">
    <label for="fg-msg">Message (optional)</label><textarea id="fg-msg" maxlength="1000"></textarea>
    <p><button type="submit" class="primary">Send</button></p>
  </form>
  <p id="fg-status" role="status"></p>
  <p class="commercial">Faraday is offered as a monthly subscription, with plans for individuals and enterprise plans by inquiry. A demonstration period is available at no charge upon inquiry.</p>
</main>
<footer><a href="/terms">Terms</a><a href="/privacy">Privacy</a><span class="v">{{APP_NAME}} v{{VERSION}}</span></footer>
<script>
(function(){var kind=null,f=document.getElementById('fg'),s=document.getElementById('fg-status');
document.querySelectorAll('[data-kind]').forEach(function(b){b.addEventListener('click',function(){kind=b.getAttribute('data-kind');f.hidden=false;s.textContent='';});});
f.addEventListener('submit',function(e){e.preventDefault();
fetch('/api/faraday-gate/request',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',
body:JSON.stringify({email:document.getElementById('fg-email').value,kind:kind,message:document.getElementById('fg-msg').value})})
.then(function(r){return r.json().then(function(j){s.textContent=r.ok?(kind==='demo'?'Thanks. Your request is in.':'You are on the waitlist.'):(j.error||'Something went wrong.');});})
.catch(function(){s.textContent='Something went wrong.';});});})();
</script>
</body>
</html>

<!doctype html>
<!-- faraday-gate · ui/gate.html (FDY-414). Static fallback gate for apps without React.
     Server fills {{APP}}, {{APP_NAME}}, {{STORY}}, {{VERSION}} (HTML-escaped). Same rules as GatePage: no prices, no counts.
     Posts to /api/faraday-gate/request on the same origin. -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{APP_NAME}} · Faraday</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600&family=IBM+Plex+Mono&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
:root{--forest:#1C3424;--forest-mid:#244228;--forest-light:#325638;--gold:#C4922A;--gold-light:#DAB050;--surface:#F8F5F0;--surface-warm:#EEE6DA;--ink:#141210;--sage:#8CA68A;--alert:#B8710A;--neutral:#B2A898}
*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:32px 16px 48px}h1{font-family:'IBM Plex Serif',serif;color:var(--forest);font-size:30px;margin:0 0 12px}
p{font-size:17px;line-height:1.55}.btns{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 20px}
button{min-height:44px;padding:0 20px;border-radius:6px;font:600 16px 'Bricolage Grotesque',system-ui,sans-serif;cursor:pointer;border:2px solid var(--forest);background:transparent;color:var(--forest)}
button.primary{background:var(--gold);border-color:var(--gold);color:var(--ink)}
form{background:var(--surface-warm);border-radius:8px;padding:16px;margin:0 0 20px}label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
input,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:6px;border:1px solid var(--neutral);font:16px 'Bricolage Grotesque',system-ui,sans-serif}
textarea{min-height:88px}:focus-visible{outline:3px solid var(--gold-light);outline-offset:2px}
.commercial{font-size:15px;color:var(--forest-mid);border-top:1px solid var(--neutral);padding-top:16px}
footer{border-top:3px solid var(--gold);background:var(--forest);color:var(--surface);padding:14px 16px;font-size:13px;display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
footer a{color:var(--surface)}.v{font-family:'IBM Plex Mono',monospace;color:var(--sage)}
</style>
</head>
<body>
<!-- faraday-masthead:start --><style data-fm-css="1.0.0">.fm,.fm *,.fm-appbar,.fm-appbar *{box-sizing:border-box}
.fm{position:relative;width:100%;background:#1C3424;color:#F8F5F0;border-top:2px solid #C4922A;border-bottom:2px solid #C4922A;font-family:'Bricolage Grotesque', system-ui, sans-serif;z-index:40}
.fm-skip{position:absolute;left:8px;top:-60px;z-index:50;background:#DAB050;color:#141210;font:600 15px 'Bricolage Grotesque', system-ui, sans-serif;padding:12px 16px;border-radius:6px;text-decoration:none;min-height:44px}
.fm-skip:focus{top:8px}
.fm-bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;height:64px;padding:0 16px;max-width:none;margin:0}
.fm-markl{justify-self:start;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;text-decoration:none}
.fm-mark{width:34px;height:34px;border-radius:6px;background:#325638;border:1px solid #C4922A;display:grid;place-items:center;font:600 18px/1 'IBM Plex Serif', Georgia, serif;color:#DAB050}
.fm-word{justify-self:center;display:inline-flex;align-items:center;min-height:44px;padding:0 4px;font:600 22px/1 'IBM Plex Serif', Georgia, serif;letter-spacing:.5px;color:#F8F5F0;text-decoration:none;white-space:nowrap}
.fm-ctx{justify-self:end;position:relative;min-width:0;max-width:100%;display:flex;align-items:center}
.fm-avatar{display:none}
.fm-panel{display:flex;align-items:center;justify-content:flex-end;gap:12px;min-width:0;max-width:100%}
.fm-app{color:#8CA68A;font:600 13px/1.2 'Bricolage Grotesque', system-ui, sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.fm-user{font:12px/1.2 'IBM Plex Mono', ui-monospace, monospace;color:#F8F5F0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26ch;min-width:0}
.fm-signin{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;color:#DAB050;font:600 14px 'Bricolage Grotesque', system-ui, sans-serif;text-decoration:underline;text-underline-offset:3px;background:none;border:0;cursor:pointer;white-space:nowrap}
.fm a:focus-visible,.fm button:focus-visible,.fm-appbar a:focus-visible,.fm-appbar button:focus-visible{outline:3px solid #DAB050;outline-offset:2px;border-radius:4px}
.fm-appbar a:focus-visible,.fm-appbar button:focus-visible{box-shadow:0 0 0 5px #1C3424}
@media (max-width:639px){.fm-bar{height:56px;padding:0 8px;gap:8px}.fm-word{font-size:20px}.fm-avatar{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:#325638;border:1px solid #C4922A;color:#DAB050;font:600 16px/1 'IBM Plex Serif', Georgia, serif;cursor:pointer;padding:0}.fm-panel{display:none;position:absolute;right:0;top:calc(100% + 8px);flex-direction:column;align-items:flex-end;gap:8px;min-width:200px;max-width:calc(100vw - 16px);padding:12px;background:#1C3424;border:1px solid #C4922A;border-radius:8px;box-shadow:0 8px 24px rgba(20,18,16,.35)}.fm-ctx[data-open="true"] .fm-panel,.fm-ctx:focus-within .fm-panel{display:flex}.fm-app,.fm-user{max-width:100%}}
.fm-appbar{width:100%;background:#EEE6DA;color:#141210;border-bottom:1px solid #B2A898;font-family:'Bricolage Grotesque', system-ui, sans-serif}
.fm-appbar-in{display:flex;align-items:center;gap:4px;min-height:48px;padding:0 12px;overflow-x:auto;scrollbar-width:thin}
.fm-applink{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:6px;color:#141210;font:600 14px 'Bricolage Grotesque', system-ui, sans-serif;text-decoration:none;white-space:nowrap}
.fm-applink:hover{background:rgba(28,52,36,.08)}
.fm-applink[aria-current="page"]{color:#1C3424;box-shadow:inset 0 -3px 0 #C4922A}
@media (prefers-reduced-motion:no-preference){.fm-skip{transition:top .12s ease}}</style><header class="fm" role="banner" data-fm="1.0.0"><a class="fm-skip" href="#main">Skip to content</a><div class="fm-bar"><a class="fm-markl" href="/" tabindex="-1" aria-hidden="true"><span class="fm-mark">F</span></a><a class="fm-word" href="/" aria-label="Faraday home">Faraday</a><div class="fm-ctx" data-open="false"><button type="button" class="fm-avatar" aria-expanded="false" aria-controls="fm-panel" aria-label="Open menu">F</button><div class="fm-panel" id="fm-panel"><span class="fm-app">{{APP_NAME}}</span></div></div></div></header><!-- faraday-masthead:end -->
<main id="main">
  <h1>{{APP_NAME}}</h1>
  <p>{{STORY}}</p>
  <div class="btns">
    <button type="button" class="primary" data-kind="demo">Request demo access</button>
    <button type="button" data-kind="waitlist">Join the waitlist</button>
  </div>
  <form id="fg" hidden>
    <label for="fg-email">Email</label><input id="fg-email" type="email" required autocomplete="email">
    <label for="fg-msg">Message (optional)</label><textarea id="fg-msg" maxlength="1000"></textarea>
    <p><button type="submit" class="primary">Send</button></p>
  </form>
  <p id="fg-status" role="status"></p>
  <p class="commercial">Faraday is offered as a monthly subscription, with plans for individuals and enterprise plans by inquiry. A demonstration period is available at no charge upon inquiry.</p>
</main>
<footer><a href="/terms">Terms</a><a href="/privacy">Privacy</a><span class="v">{{APP_NAME}} v{{VERSION}}</span></footer>
<script>
(function(){var kind=null,f=document.getElementById('fg'),s=document.getElementById('fg-status');
document.querySelectorAll('[data-kind]').forEach(function(b){b.addEventListener('click',function(){kind=b.getAttribute('data-kind');f.hidden=false;s.textContent='';});});
f.addEventListener('submit',function(e){e.preventDefault();
fetch('/api/faraday-gate/request',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',
body:JSON.stringify({email:document.getElementById('fg-email').value,kind:kind,message:document.getElementById('fg-msg').value})})
.then(function(r){return r.json().then(function(j){s.textContent=r.ok?(kind==='demo'?'Thanks. Your request is in.':'You are on the waitlist.'):(j.error||'Something went wrong.');});})
.catch(function(){s.textContent='Something went wrong.';});});})();
</script>
</body>
</html>
